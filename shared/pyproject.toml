[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survey-agent-lib"
version = "0.1.0"
requires-python = ">=3.11"
description = "Shared LLM clients and utilities for the NLP-CSS survey agent pipeline"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
lrz = ["torch", "transformers", "accelerate"]

[tool.hatch.build.targets.wheel]
packages = ["src/survey_agent_lib"]
