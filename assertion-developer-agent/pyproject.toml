[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assertion-developer"
version = "0.1.0"
requires-python = ">=3.11"
description = "Assertion Developer Agent for survey questionnaire design"
dependencies = [
    "survey-agent-lib",
    "concept-mapper",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
lrz = ["torch", "transformers", "accelerate", "bitsandbytes"]

[project.scripts]
assertion-developer = "assertion_developer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/assertion_developer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
