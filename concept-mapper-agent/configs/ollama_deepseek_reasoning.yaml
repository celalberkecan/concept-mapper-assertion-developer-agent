# Matches DeepSeekR1-0528-Qwen3-8B used in the transformers config. TAG UNVERIFIED:
# Ollama's official "deepseek-r1" library tag naming has changed across releases —
# "deepseek-r1:8b" may or may not point at this exact 0528/Qwen3-8B checkpoint at
# pull time. Check https://ollama.com/library/deepseek-r1 (and the community upload
# sam860/deepseek-r1-0528-qwen3:8b as a fallback) before relying on this for real
# results. It emits a <think>...</think> trace before the answer, so it needs a much
# larger token budget and a longer HTTP timeout than the instruct models.
provider: ollama
model: deepseek-r1:8b
base_url: http://localhost:11434
temperature: 0.0
max_tokens: 4096
timeout: 600
